name: CobbVisionCompanion
options:
  bundleIdPrefix: com.cobbvision
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Release
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CobbVisionCompanion:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cobbvision.companion
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""   # set your Apple Team ID here
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/CobbVisionCompanion.entitlements

# Generate with: brew install xcodegen && xcodegen generate
