name: Release (TestFlight)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      readonly_match:
        description: "Use existing certs/profiles (set to false on the very first run to mint them)"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  XCODE_VERSION: "26.0"

jobs:
  beta:
    name: Build, sign, upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          MATCH_READONLY: ${{ inputs.readonly_match != false }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bundle exec fastlane beta
